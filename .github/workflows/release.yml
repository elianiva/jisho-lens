# Push a tag such as v1.2.3 to build the signed stable APK and app bundle and
# publish them as a GitHub release for that tag. The tag names the version, so
# the artifact and its release always agree.
#
# Tag pushes skip CI, so this workflow waits for the CI run that already passed
# on the tag's commit instead of building unchecked code. Run it by hand on a
# tag to retry a release that failed after CI passed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Publishing uses this repository's signing secrets, so only the owner starts
  # it. A fork carries this file but not the owner, so it refuses there too.
  gate:
    if: >-
      github.repository_owner == 'elianiva' &&
      github.actor == 'elianiva' &&
      github.triggering_actor == 'elianiva'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the tag
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow on a v* tag, not on $TAG."
            exit 1
          fi
          version="${TAG#v}"
          if ! printf '%s' "$TAG" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$TAG is not a v<major>.<minor>.<patch> tag."
            exit 1
          fi
          minor="${version#*.}"
          minor="${minor%%.*}"
          patch="${version##*.}"
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
            echo "::error::$TAG has a minor or patch of 100 or more; versionCode cannot hold it."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG as version $version."

      - name: Wait for CI to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "Waiting for a successful CI run on $SHA."
          # Tag pushes do not start CI, so the run this waits for came from the
          # branch push that carried the same commit.
          for attempt in {1..30}; do
            runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20")"
            if printf '%s' "$runs" | jq -e '[.workflow_runs[] | select(.conclusion == "success")] | length > 0' >/dev/null; then
              echo "CI passed on $SHA."
              exit 0
            fi
            if printf '%s' "$runs" | jq -e '[.workflow_runs[] | select(.status != "completed")] | length > 0' >/dev/null; then
              echo "Attempt $attempt: CI is still running; waiting 60 s."
            elif printf '%s' "$runs" | jq -e '.workflow_runs | length == 0' >/dev/null; then
              echo "Attempt $attempt: CI has not started on $SHA; waiting 60 s."
            else
              echo "::error::CI did not pass on $SHA; refusing to release."
              exit 1
            fi
            sleep 60
          done
          echo "::error::Timed out waiting for CI on $SHA."
          exit 1

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6

      # A release that is not signed cannot be installed, so a missing secret
      # stops the build here instead of publishing an unsigned artifact.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "JISHO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the signed release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          JISHO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JISHO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JISHO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleStableRelease :app:bundleStableRelease -PversionName="$VERSION" --console=plain

      # The tag supplies the version, so the build reporting a different one
      # means something in the pipeline is wrong, not that the release is fine.
      - name: Check the signature and the version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          apk="app/build/outputs/apk/stable/release/app-stable-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          built="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$apk")"
          if [ "$built" != "$VERSION" ]; then
            echo "::error::The APK has version $built, but the tag is $VERSION."
            exit 1
          fi

      - name: Name the artifacts after the version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/stable/release/app-stable-release.apk "dist/jisho-lens-$VERSION.apk"
          cp app/build/outputs/bundle/stableRelease/app-stable-release.aab "dist/jisho-lens-$VERSION.aab"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    # Publishing writes the release, so it repeats the owner check instead of
    # trusting the gate alone.
    if: github.repository_owner == 'elianiva'
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The release notes are the CHANGELOG.md section for the version, so the
      # release says what the changelog says. The commit is the tag's commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum jisho-lens-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          awk -v version="$VERSION" \
            '$0 ~ "^## " version "([ (]|$)" { on = 1; next } on && /^## / { exit } on' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "CHANGELOG.md has no section for $VERSION; using the generated notes."
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* \
            --title "Jisho Lens $VERSION" \
            --verify-tag \
            "${notes[@]}"
